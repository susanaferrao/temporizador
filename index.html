.wrap{position:fixed;inset:0;padding:max(3vh,env(safe-area-inset-top)) 4vw 3vh;display:grid;grid-template-rows:auto 1fr auto}
header{justify-self:end;text-align:right;max-width:62vw}
header .ag{font-size:clamp(18px,2.6vw,34px);font-weight:700;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,40,50,.35)}
header .sub{font-size:clamp(15px,2vw,26px);font-weight:600;opacity:.9;margin-top:.3em;text-shadow:0 1px 6px rgba(0,40,50,.35)}
.stage{display:flex;align-items:center;justify-content:center;padding:1vh 0}
.timer{width:94vw;max-height:100%;text-align:center;padding:1vh 2vw 2.2vh;border-radius:28px;background:var(--panel);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:background .5s,color .5s;cursor:pointer}
.digits{font-weight:700;font-variant-numeric:tabular-nums;font-size:min(27vw,56vh);line-height:1;letter-spacing:-.02em}
body.over .digits{font-size:min(23vw,56vh)}
.label{font-size:clamp(18px,3vw,40px);font-weight:600;margin-top:.5vh;opacity:.95}
body.over .timer{background:var(--over);color:var(--over-ink)}
body.paused .digits{opacity:.75}
.controls{justify-self:end;display:flex;gap:12px;align-items:center;transition:opacity .6s}
body.running.idle .controls{opacity:.12}
button{font:inherit;font-size:18px;font-weight:600;color:#fff;background:rgba(22,62,74,.55);border:1.5px solid rgba(255,255,255,.55);
  border-radius:14px;padding:12px 18px;min-height:52px;min-width:52px}
button:active{transform:scale(.97)}
button.play{background:#fff;color:var(--navy);border-color:#fff;min-width:96px;display:flex;align-items:center;justify-content:center}
button.play svg{width:26px;height:26px;fill:currentColor}
button.confirm{background:#F5A623;color:#2B1A00;border-color:#F5A623}
.dur{display:flex;align-items:center;gap:8px;background:rgba(22,62,74,.55);border-radius:14px;padding:4px 6px;border:1.5px solid rgba(255,255,255,.55)}
.dur button{background:transparent;border:0;min-width:44px;padding:8px}
.dur span{font-size:18px;font-weight:600;min-width:5.2em;text-align:center}
body.started .dur{opacity:.35;pointer-events:none}
</style>
</head>
<body class="idle">
<div class="wrap">
  <header>
    <div class="ag">Agrupamento de Escolas Póvoa de Santa Iria</div>
    <div class="sub">Entrevistas para o cargo de Diretor</div>
  </header>
  <div class="stage">
    <div class="timer" id="timer" role="button" aria-label="Iniciar ou pausar">
      <div class="digits" id="digits">30:00</div>
      <div class="label" id="label">Toque para iniciar</div>
    </div>
  </div>
  <div class="controls">
    <div class="dur"><button id="minus" aria-label="Menos 5 minutos">−</button><span id="durTxt">30 min</span><button id="plus" aria-label="Mais 5 minutos">+</button></div>
    <button id="reset">Repor</button>
    <button class="play" id="play" aria-label="Iniciar ou pausar"></button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>';
const KEY = "temporizador-aepsi";
let st = {dur:30, accum:0, since:0, running:false};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && typeof s.dur === "number") st = s; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
const elapsed = () => st.accum + (st.running ? Date.now() - st.since : 0);
const fmt = ms => { const t = Math.floor(Math.abs(ms)/1000); return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); };

function draw(){
  const el = elapsed(), rem = st.dur*60000 - el, over = rem < 0;
  // contagem decrescente; depois do zero conta para cima
  $("digits").textContent = over ? "+" + fmt(-rem + 999) : fmt(rem + 999);
  const started = el > 0 || st.running;
  $("label").textContent = over ? "Tempo excedido" : st.running ? "Tempo restante" : started ? "Em pausa" : "Toque para iniciar";
  document.body.classList.toggle("over", over);
  document.body.classList.toggle("running", st.running);
  document.body.classList.toggle("paused", started && !st.running);
  document.body.classList.toggle("started", started);
  const ico = st.running ? ICON_PAUSE : ICON_PLAY; if($("play").dataset.i !== ico){ $("play").innerHTML = ico; $("play").dataset.i = ico; }
  $("durTxt").textContent = st.dur + " min";
}
function toggle(){
  if(st.running){ st.accum = elapsed(); st.running = false; }
  else { st.since = Date.now(); st.running = true; manterLigado(); }
  save(); draw(); acordar();
}
$("timer").onclick = toggle;
$("play").onclick = toggle;
// repor: 1.º toque pede confirmação no próprio botão, 2.º toque (em 3 s) repõe
let resetT = null;
$("reset").onclick = () => {
  const b = $("reset");
  if(b.classList.contains("confirm")){
    clearTimeout(resetT); b.classList.remove("confirm"); b.textContent = "Repor";
    st = {dur:st.dur, accum:0, since:0, running:false}; save(); draw();
  } else {
    b.classList.add("confirm"); b.textContent = "Tocar de novo";
    resetT = setTimeout(() => { b.classList.remove("confirm"); b.textContent = "Repor"; }, 3000);
  }
};
$("minus").onclick = () => { st.dur = Math.max(5, st.dur - 5); save(); draw(); };
$("plus").onclick  = () => { st.dur = Math.min(120, st.dur + 5); save(); draw(); };

// os botões ficam quase invisíveis enquanto o tempo corre; um toque volta a mostrá-los
let idleT;
function acordar(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 4000); }
document.addEventListener("pointerdown", acordar);

// manter o ecrã ligado (quando o navegador permite)
let wl = null;
async function manterLigado(){ try { if("wakeLock" in navigator && !wl){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); } } catch(e){} }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && st.running) manterLigado(); });

draw(); acordar();
setInterval(draw, 200);
</script>
</body>
</html>
